<div class="create-event-container">
    <h2>Create New Event</h2>
    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="eventName">Event Name</label>
        <input type="text" id="eventName" formControlName="eventName" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" class="form-control"></textarea>
      </div>
  
      <div class="form-grid">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" formControlName="date" class="form-control">
        </div>
  
        <div class="form-group">
          <label for="time">Time</label>
          <input type="time" id="time" formControlName="time" class="form-control">
        </div>
      </div>
  
      <div class="form-group">
        <label for="venue">Venue</label>
        <input type="text" id="venue" formControlName="venue" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" formControlName="capacity" class="form-control">
      </div>
  
      <button type="submit" class="submit-btn">Create Event</button>
    </form>
  </div>
