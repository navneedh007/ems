<div class="login-container min-vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-header bg-white border-0 pt-4">
            <h3 class="text-center fw-bold text-primary mb-0">Welcome Back</h3>
            <p class="text-center text-muted small mt-2">Please login to your account</p>
          </div>
          <div class="card-body px-4 py-4">
            <form (ngSubmit)="onSubmit()">
              <div class="mb-4">
                <label for="email" class="form-label small fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-lg" id="email" 
                       [(ngModel)]="loginData.Email" name="email" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" 
                       [(ngModel)]="loginData.Password" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Sign In</button>
              <p class="text-center text-muted small mb-0">
                Don't have an account? <a routerLink="/app-register" class="text-primary text-decoration-none">Register</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.login-container {
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
}

.form-control {
  border: 1px solid #dee2e6;
  padding: 0.75rem 1rem;
}

.form-control:focus {
  box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
}
</style>
